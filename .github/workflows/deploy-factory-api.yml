name: Deploy Factory API

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Source branch to validate and deploy (fixed to the reviewed integration branch)
        required: true
        type: choice
        default: feat/antigravity-integrated-agent-runtime-final-2026-11-04
        options:
          - feat/antigravity-integrated-agent-runtime-final-2026-11-04

permissions:
  contents: read

concurrency:
  group: factory-api-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: factory-api
    steps:
      - name: Validate selected source branch
        working-directory: .
        env:
          SOURCE_REF: ${{ inputs.source_ref }}
        run: |
          set -euo pipefail
          test "$SOURCE_REF" = "feat/antigravity-integrated-agent-runtime-final-2026-11-04"
          echo "Validated reviewed integration branch: $SOURCE_REF"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.source_ref }}
          fetch-depth: 1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Validate deployment configuration
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          FACTORY_D1_DATABASE_ID: ${{ secrets.FACTORY_D1_DATABASE_ID }}
          FACTORY_API_TOKEN_SHA256: ${{ secrets.FACTORY_API_TOKEN_SHA256 }}
          FACTORY_RUNNER_TOKEN: ${{ secrets.FACTORY_RUNNER_TOKEN }}
          FACTORY_API_CORS_ORIGIN: ${{ vars.FACTORY_API_CORS_ORIGIN }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$FACTORY_D1_DATABASE_ID"
          test -n "$FACTORY_API_TOKEN_SHA256"
          test -n "$FACTORY_RUNNER_TOKEN"
          test "${#FACTORY_RUNNER_TOKEN}" -ge 32
          [[ "$FACTORY_API_TOKEN_SHA256" =~ ^[a-fA-F0-9]{64}$ ]]
          [[ "$FACTORY_D1_DATABASE_ID" =~ ^[a-fA-F0-9-]{36}$ ]]
          [[ "$FACTORY_API_CORS_ORIGIN" =~ ^https://[^*]+$ ]]
          echo "Required deployment settings are present."
      - run: npm install
      - run: npm run check
      - run: npm test
      - name: Configure D1 and allowed origin
        env:
          FACTORY_D1_DATABASE_ID: ${{ secrets.FACTORY_D1_DATABASE_ID }}
          FACTORY_API_CORS_ORIGIN: ${{ vars.FACTORY_API_CORS_ORIGIN }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const path = "wrangler.toml";
          let config = fs.readFileSync(path, "utf8");
          config = config.replace("00000000-0000-0000-0000-000000000000", process.env.FACTORY_D1_DATABASE_ID);
          config = config.replace("https://replace-with-your-owned-domain.example", process.env.FACTORY_API_CORS_ORIGIN);
          if (config.includes("00000000-0000-0000-0000-000000000000") ||
              config.includes("https://replace-with-your-owned-domain.example")) {
            throw new Error("Deployment placeholders were not replaced.");
          }
          fs.writeFileSync(path, config);
          NODE
      - name: Apply D1 migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 migrations apply universal-ai-factory --remote
      - name: Set API token digest
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          FACTORY_API_TOKEN_SHA256: ${{ secrets.FACTORY_API_TOKEN_SHA256 }}
        run: printf '%s' "$FACTORY_API_TOKEN_SHA256" | npx wrangler secret put API_TOKEN_SHA256
      - name: Set trusted runner event token
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          FACTORY_RUNNER_TOKEN: ${{ secrets.FACTORY_RUNNER_TOKEN }}
        run: printf '%s' "$FACTORY_RUNNER_TOKEN" | npx wrangler secret put FACTORY_RUNNER_TOKEN
      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

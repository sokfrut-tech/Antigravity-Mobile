name: Authorized Security DAST

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: HTTPS staging URL whose hostname is allowlisted in the security-lab environment
        required: true
        type: string
      authorization:
        description: Type exactly I_OWN_THIS_TARGET_OR_HAVE_WRITTEN_PERMISSION
        required: true
        type: string
      profile:
        description: Scanner profile
        required: true
        type: choice
        options:
          - zap
          - wapiti
          - nuclei
          - all
        default: all

permissions:
  contents: read

jobs:
  dast:
    uses: sokfrut-tech/Universal-AI-Factory/.github/workflows/factory-dast-reusable.yml@9fcfd92c1cc38e0f09a0d9a0e6dea9b9042f881e
    with:
      target_url: ${{ inputs.target_url }}
      authorization: ${{ inputs.authorization }}
      profile: ${{ inputs.profile }}
    permissions:
      contents: read

name: Android Emulator UI Tests

on:
  pull_request:
    branches: [main]
    paths:
      - "app/**"
      - ".github/workflows/android-emulator-ui.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: antigravity-mobile-emulator-${{ github.ref }}
  cancel-in-progress: true

jobs:
  instrumented-ui:
    name: Run Compose UI tests on Android Emulator
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Boot emulator and run instrumented UI tests
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            set +e
            gradle --no-daemon :app:connectedDebugAndroidTest
            test_exit=$?
            adb logcat -d > "$GITHUB_WORKSPACE/emulator-logcat.txt" || true
            exit "$test_exit"

      - name: Upload emulator test reports and logcat
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: antigravity-android-emulator-reports
          path: |
            app/build/reports/androidTests/connected/
            app/build/outputs/androidTest-results/connected/
            emulator-logcat.txt
          if-no-files-found: warn
          retention-days: 14

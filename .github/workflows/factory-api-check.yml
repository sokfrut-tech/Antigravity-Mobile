name: Factory API checks

on:
  push:
    branches: [main]
    paths:
      - "factory-api/**"
      - ".github/workflows/factory-api-check.yml"
  pull_request:
    branches: [main]
    paths:
      - "factory-api/**"
      - ".github/workflows/factory-api-check.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: factory-api-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: factory-api
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.x"
      - run: npm install
      - run: npm run check
      - run: npm test
      - name: Test run ledger migrations and SQLite transaction invariants
        run: python test/run-ledger-sqlite.integration.py -v
      - name: Apply D1 migrations locally
        run: npx wrangler d1 migrations apply universal-ai-factory --local
      - run: npx wrangler deploy --dry-run --outdir .wrangler-dry-run

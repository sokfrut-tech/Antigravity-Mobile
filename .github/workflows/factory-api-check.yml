name: Factory API checks

on:
  push:
    branches: [main]
    paths:
      - "factory-api/**"
      - ".github/workflows/factory-api-check.yml"
  pull_request:
    branches: [main]
    paths:
      - "factory-api/**"
      - ".github/workflows/factory-api-check.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: factory-api-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: factory-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: factory-api/package-lock.json
      - run: npm install --ignore-scripts
      - run: npm run check
      - run: npm test
      - run: npx wrangler deploy --dry-run --outdir .wrangler-dry-run
